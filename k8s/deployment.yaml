apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo-app
  labels:
    app.kubernetes.io/name: k8s-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-demo-app
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          # CI/CD should replace this image with the image built for the commit.
          image: k8s-demo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-demo-app
spec:
  selector:
    app.kubernetes.io/name: k8s-demo-app
  ports:
    - name: http
      port: 80
      targetPort: http
