replicaCount: 2

image:
  repository: k8s-demo-app
  # CI should override this with an immutable commit tag.
  tag: latest
  pullPolicy: IfNotPresent

# Reference existing registry credentials in the release namespace.
# imagePullSecrets:
#   - name: registry-credentials
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

containerPort: 18080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
